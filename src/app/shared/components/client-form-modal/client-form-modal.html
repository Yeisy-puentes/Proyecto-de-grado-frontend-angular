<div class="modal-overlay" (click)="close.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal__header">
      <div class="modal__header-left">
        <div class="modal__icon-badge">
          @if (mode() === 'edit') {
            <svg width="20" height="20" style="color:#fff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
          } @else {
            <svg width="20" height="20" style="color:#fff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          }
        </div>
        <h3 class="modal__title">{{ mode() === 'edit' ? 'Editar Cliente' : 'Nuevo Cliente' }}</h3>
      </div>
      <button class="modal__close" type="button" (click)="close.emit()" aria-label="Cerrar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <form class="modal__body" appFormValidation #f="ngForm" (ngSubmit)="f.valid && onSubmit()">
      <div class="field">
        <label [for]="idPrefix() + '-name'">Nombre Completo *</label>
        <input required [id]="idPrefix() + '-name'" name="name" class="input" placeholder="Ej: María Rodríguez" [(ngModel)]="form.name" #nameCtrl="ngModel" />
        <app-field-error [control]="nameCtrl" [form]="f" />
      </div>
      <div class="field">
        <label [for]="idPrefix() + '-cedula'">Cédula *</label>
        <input required [id]="idPrefix() + '-cedula'" name="cedula" class="input" placeholder="123456789" [(ngModel)]="form.cedula" #cedulaCtrl="ngModel" />
        <app-field-error [control]="cedulaCtrl" [form]="f" />
      </div>
      <div class="field">
        <label [for]="idPrefix() + '-email'">Correo Electrónico <span class="field-optional">(opcional)</span></label>
        <input type="email" [id]="idPrefix() + '-email'" name="email" class="input" placeholder="ejemplo@correo.com" email [(ngModel)]="form.email" #emailCtrl="ngModel" />
        <app-field-error [control]="emailCtrl" [form]="f" />
      </div>
      <div class="field">
        <label [for]="idPrefix() + '-phone'">Teléfono *</label>
        <input required type="tel" [id]="idPrefix() + '-phone'" name="phone" class="input" placeholder="3001234567" [(ngModel)]="form.phone" #phoneCtrl="ngModel" />
        <app-field-error [control]="phoneCtrl" [form]="f" />
      </div>
      <div class="field">
        <label [for]="idPrefix() + '-address'">Dirección <span class="field-optional">(opcional)</span></label>
        <textarea [id]="idPrefix() + '-address'" name="address" class="textarea" rows="2" placeholder="Calle 123 #45-67" [(ngModel)]="form.address" #addressCtrl="ngModel"></textarea>
        <app-field-error [control]="addressCtrl" [form]="f" />
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn--ghost" (click)="close.emit()">Cancelar</button>
        <button type="submit" class="btn btn--cyan">{{ mode() === 'edit' ? 'Guardar Cambios' : 'Crear Cliente' }}</button>
      </div>
    </form>
  </div>
</div>
