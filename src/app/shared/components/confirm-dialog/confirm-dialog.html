@if (confirm.current(); as request) {
  <div class="modal-overlay" (click)="confirm.close(false)">
    <div
      class="modal confirm"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-message"
      (click)="$event.stopPropagation()"
    >
      <div [class]="'confirm__icon confirm__icon--' + request.tone">
        @if (request.tone === 'danger') {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        } @else {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        }
      </div>
      <h3 id="confirm-title" class="confirm__title">{{ request.title }}</h3>
      <p id="confirm-message" class="confirm__message">{{ request.message }}</p>
      <div class="confirm__actions">
        <button #cancelButton type="button" class="btn btn--outline" (click)="confirm.close(false)">{{ request.cancelLabel }}</button>
        <button type="button" [class]="'btn confirm__ok confirm__ok--' + request.tone" (click)="confirm.close(true)">{{ request.confirmLabel }}</button>
      </div>
    </div>
  </div>
}
