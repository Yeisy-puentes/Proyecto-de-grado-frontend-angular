<div class="toast-stack" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      [class]="'toast toast--' + toast.type"
      [attr.role]="toast.type === 'error' ? 'alert' : 'status'"
      (mouseenter)="toastService.pause(toast.id)"
      (mouseleave)="toastService.resume(toast.id)"
    >
      <span class="toast__icon" aria-hidden="true">
        @switch (toast.type) {
          @case ('success') {
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          }
          @case ('error') {
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          }
          @default {
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          }
        }
      </span>

      <div class="toast__body">
        <p class="toast__title">{{ titles[toast.type] }}</p>
        <p class="toast__message">{{ toast.message }}</p>
      </div>

      <button type="button" class="toast__close" aria-label="Cerrar" (click)="toastService.dismiss(toast.id)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

      <!-- Barra de tiempo restante -->
      @if (toast.duration) {
        @for (v of [toast.version]; track v) {
          <span class="toast__progress" [style.animation-duration.ms]="toast.duration"></span>
        }
      }
    </div>
  }
</div>
