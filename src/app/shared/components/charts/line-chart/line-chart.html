@if (hasData()) {
  <svg [attr.viewBox]="viewBox" preserveAspectRatio="none" aria-hidden="true">
    <!-- Cuadrícula horizontal punteada (sin líneas de eje) -->
    @for (tick of ticks(); track tick.y) {
      <line [attr.x1]="left" [attr.x2]="right" [attr.y1]="tick.y" [attr.y2]="tick.y" stroke="#e2e8f0" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" />
    }
    <defs>
      <linearGradient [attr.id]="gradientId" x1="0" y1="0" x2="0" y2="1">
        <stop offset="5%" [attr.stop-color]="color()" stop-opacity="0.1" />
        <stop offset="95%" [attr.stop-color]="color()" stop-opacity="0" />
      </linearGradient>
    </defs>
    <path [attr.d]="areaPath()" [attr.fill]="'url(#' + gradientId + ')'" />
    @if (active(); as a) {
      <!-- Línea guía del hover -->
      <line [attr.x1]="a.x" [attr.x2]="a.x" [attr.y1]="top" [attr.y2]="bottom" stroke="#cbd5e1" stroke-width="1" vector-effect="non-scaling-stroke" />
    }
    <path [attr.d]="linePath()" fill="none" [attr.stroke]="color()" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
  </svg>

  <!-- Eje Y -->
  @for (tick of ticks(); track tick.y) {
    <span class="axis-label axis-label--y" [style.top.%]="tick.top" [style.width.%]="(left - 10) / 6.5">{{ tick.label }}</span>
  }
  <!-- Eje X -->
  @for (c of coords(); track $index) {
    <span class="axis-label axis-label--x" [style.left.%]="pctX(c.x)" [class.is-active]="activeIndex() === $index">{{ c.label }}</span>
  }

  @if (active(); as a) {
    <span class="active-dot" [style.left.%]="a.left" [style.top.%]="a.top" [style.background]="color()"></span>
    <div class="chart-tooltip" [class.chart-tooltip--flip]="a.flip" [style.left.%]="a.left" [style.top.%]="a.top">
      <p class="chart-tooltip__label">{{ a.label }}</p>
      <p class="chart-tooltip__value" [style.color]="color()">{{ seriesName() }} : {{ money(a.value) }}</p>
    </div>
  }
} @else {
  <p class="chart-empty">Sin datos para el período.</p>
}
