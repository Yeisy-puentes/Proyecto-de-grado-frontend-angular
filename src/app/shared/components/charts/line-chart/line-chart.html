<div class="plot" #plot>
  @if (hasData()) {
    <svg [attr.viewBox]="viewBox()" aria-hidden="true">
      <defs>
        <!-- Área: más visible arriba y se desvanece hacia abajo -->
        <linearGradient [attr.id]="gradientId" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" [style.stop-color]="color()" stop-opacity="0.28" />
          <stop offset="0.6" [style.stop-color]="color()" stop-opacity="0.08" />
          <stop offset="1" [style.stop-color]="color()" stop-opacity="0" />
        </linearGradient>
      </defs>

      <!-- Eje Y y guías punteadas -->
      @for (tick of ticks(); track $index) {
        <line class="grid-line" [class.grid-line--base]="$first" [attr.x1]="pad.left" [attr.x2]="plotRight()" [attr.y1]="tick.y" [attr.y2]="tick.y" />
        <text class="axis-y" [attr.x]="pad.left - 10" [attr.y]="tick.y">{{ tick.label }}</text>
      }

      <path class="area" [attr.d]="areaPath()" [attr.fill]="'url(#' + gradientId + ')'" />

      @if (active(); as a) {
        <line class="guide-line" [attr.x1]="a.x" [attr.x2]="a.x" [attr.y1]="pad.top" [attr.y2]="baseline()" />
      }

      <path class="line" [attr.d]="solidPath()" [style.stroke]="color()" />
      @if (dashedPath()) {
        <path class="line line--dashed" [attr.d]="dashedPath()" [style.stroke]="color()" />
      }

      <!-- Punto en cada mes -->
      @for (c of coords(); track $index; let i = $index) {
        <circle
          class="dot"
          [class.is-active]="activeIndex() === i"
          [class.is-partial]="partialLast() && $last"
          [attr.cx]="c.x" [attr.cy]="c.y"
          [attr.r]="activeIndex() === i ? 5 : 3.5"
          [style.stroke]="color()"
          [style.fill]="activeIndex() === i ? color() : null"
        />
        @if (i % labelStep() === 0) {
          <text class="axis-x" [class.is-active]="activeIndex() === i" [attr.x]="c.x" [attr.y]="baseline() + 19">{{ c.label }}</text>
        }
      }
    </svg>

    @if (active(); as a) {
      <div class="chart-tooltip" [class.chart-tooltip--flip]="a.flip" [style.left.px]="a.x" [style.top.px]="a.y">
        <p class="chart-tooltip__label">
          {{ a.fullLabel }}
          @if (a.partial) {
            <span class="chart-tooltip__tag">Mes en curso</span>
          }
        </p>
        <p class="chart-tooltip__row">
          <span class="chart-tooltip__dot" [style.background]="color()"></span>
          <span class="chart-tooltip__name">{{ seriesName() }}</span>
          <strong>{{ a.text }}</strong>
        </p>
      </div>
    }
  } @else {
    <p class="chart-empty">{{ emptyText() }}</p>
  }
</div>
