@if (hasData()) {
  <svg viewBox="0 0 500 240" preserveAspectRatio="none">
    <line x1="0" [attr.y1]="baseline" x2="500" [attr.y2]="baseline" stroke="#e2e8f0" />
    @for (group of groups(); track group.label) {
      @for (bar of group.bars; track $index) {
        <rect [attr.x]="bar.x" [attr.y]="bar.y" [attr.width]="bar.width" [attr.height]="bar.height" [attr.fill]="bar.color" rx="3">
          <title>{{ group.label }} — {{ bar.title }}</title>
        </rect>
      }
      <text [attr.x]="group.center" [attr.y]="baseline + 18" fill="#64748b" font-size="11" text-anchor="middle">{{ group.label }}</text>
    }
  </svg>
} @else {
  <p class="chart-empty">Sin datos para el período.</p>
}
