<div class="input-icon search-box">
  <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  <input
    #field
    type="text"
    class="input search-box__input"
    [class.has-value]="value()"
    [placeholder]="placeholder()"
    [attr.aria-label]="placeholder()"
    [value]="value()"
    (input)="valueChange.emit(field.value)"
  />
  @if (value()) {
    <button type="button" class="search-box__clear" title="Limpiar búsqueda" aria-label="Limpiar búsqueda" (click)="valueChange.emit(''); field.focus()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  }
</div>
