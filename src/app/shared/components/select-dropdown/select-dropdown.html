<div class="select" [class.is-open]="open()">
  <button
    type="button"
    class="select__trigger"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="listId"
    [attr.aria-activedescendant]="open() ? optionId(activeIndex()) : null"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
  >
    <span class="select__value">
      {{ selected()?.label }}
      @if (selected()?.count !== undefined) {
        <span class="select__sep">·</span>
        <span class="select__value-count">{{ selected()?.count }}</span>
      }
    </span>
    <svg class="select__chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
  </button>

  @if (open()) {
    <ul class="select__list" role="listbox" [id]="listId" [attr.aria-label]="ariaLabel()">
      @for (option of options(); track $index; let i = $index) {
        <li
          role="option"
          class="select__option"
          [id]="optionId(i)"
          [class.is-selected]="i === selectedIndex()"
          [class.is-active]="i === activeIndex()"
          [attr.aria-selected]="i === selectedIndex()"
          (click)="choose(i)"
          (mouseenter)="activeIndex.set(i)"
        >
          <span class="select__check" aria-hidden="true">
            @if (i === selectedIndex()) {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            }
          </span>
          <span class="select__label">{{ option.label }}</span>
          @if (option.count !== undefined) {
            <span class="select__count">{{ option.count }}</span>
          }
        </li>
      }
    </ul>
  }
</div>
