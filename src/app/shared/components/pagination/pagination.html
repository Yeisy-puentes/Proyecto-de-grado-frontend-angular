@if (total() > 0) {
  <nav class="pagination" aria-label="Paginación">
    @if (totalPages() > 1) {
      <div class="pagination__bar">
        <button type="button" class="pagination__btn" title="Primera página" aria-label="Primera página" [disabled]="isFirst()" (click)="goTo(1)">←</button>
        <button type="button" class="pagination__btn" title="Página anterior" aria-label="Página anterior" [disabled]="isFirst()" (click)="goTo(current() - 1)">«</button>
        @for (p of pages(); track p) {
          <button
            type="button"
            class="pagination__btn pagination__num"
            [class.is-active]="p === current()"
            [class.is-far]="isFar(p)"
            [attr.aria-current]="p === current() ? 'page' : null"
            [attr.aria-label]="'Página ' + p"
            (click)="goTo(p)"
          >{{ p }}</button>
        }
        <button type="button" class="pagination__btn" title="Página siguiente" aria-label="Página siguiente" [disabled]="isLast()" (click)="goTo(current() + 1)">»</button>
        <button type="button" class="pagination__btn" title="Última página" aria-label="Última página" [disabled]="isLast()" (click)="goTo(totalPages())">→</button>
      </div>
    }

    <p class="pagination__info">
      Mostrando <strong>{{ from() }}–{{ to() }}</strong> de <strong>{{ total() }}</strong>
    </p>
  </nav>
}
