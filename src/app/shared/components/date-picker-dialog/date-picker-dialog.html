<div class="dp-backdrop" (click)="cancel()"></div>

<div #panel class="dp-panel" role="dialog" aria-modal="true" aria-label="Elegir fecha" (keydown)="onPanelKeydown($event)">
  <div class="dp-header">
    <button type="button" class="dp-nav" [attr.aria-label]="view() === 'days' ? 'Mes anterior' : view() === 'months' ? 'Año anterior' : 'Años anteriores'" (click)="prev()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button type="button" class="dp-title" [attr.aria-label]="view() === 'days' ? 'Elegir mes y año: ' + title() : 'Cambiar vista: ' + title()" aria-live="polite" (click)="toggleView()">
      {{ title() }}
      <svg class="dp-title__chevron" [class.is-open]="view() !== 'days'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <button type="button" class="dp-nav" [attr.aria-label]="view() === 'days' ? 'Mes siguiente' : view() === 'months' ? 'Año siguiente' : 'Años siguientes'" (click)="next()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  @switch (view()) {
    @case ('days') {
      <div class="dp-weekdays" aria-hidden="true">
        @for (weekday of weekdays; track weekday) {
          <span>{{ weekday }}</span>
        }
      </div>
      <div class="dp-grid" (keydown)="onGridKeydown($event)">
        @for (d of days(); track d.key) {
          <button
            type="button"
            class="dp-day"
            [class.is-outside]="d.isOutside"
            [class.is-today]="d.isToday"
            [class.is-selected]="d.isSelected"
            [attr.data-key]="d.key"
            [attr.tabindex]="d.key === focusedKey() ? 0 : -1"
            [attr.aria-label]="d.label"
            [attr.aria-pressed]="d.isSelected"
            [attr.aria-current]="d.isToday ? 'date' : null"
            (click)="select(d.key)"
          >{{ d.day }}</button>
        }
      </div>
    }
    @case ('months') {
      <div class="dp-choices">
        @for (month of months; track month; let i = $index) {
          <button type="button" class="dp-choice" [class.is-selected]="i === viewMonth().getMonth()" (click)="chooseMonth(i)">{{ month }}</button>
        }
      </div>
    }
    @case ('years') {
      <div class="dp-choices">
        @for (year of years(); track year) {
          <button type="button" class="dp-choice" [class.is-selected]="year === viewMonth().getFullYear()" (click)="chooseYear(year)">{{ year }}</button>
        }
      </div>
    }
  }

  <div class="dp-footer">
    <button type="button" class="dp-btn dp-btn--primary" (click)="selectToday()">Hoy</button>
    <span class="dp-footer__spacer"></span>
    <button type="button" class="dp-btn" (click)="clear()">Limpiar</button>
    <button type="button" class="dp-btn" (click)="cancel()">Cancelar</button>
  </div>
</div>
